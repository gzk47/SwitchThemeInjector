name: Build
on:
  workflow_dispatch:

jobs:
  build:
    name: Build and Release
    runs-on: ubuntu-latest
    container: devkitpro/devkita64:latest
    permissions:
      contents: write

    steps:
      - name: Add safe.directory Update libnx
        run: |
          git config --global --add safe.directory "*"
          # git clone --recurse-submodules https://github.com/switchbrew/libnx.git
          # cd libnx
          # make -j$(nproc) install

      - name: Checkout latest code
        uses: actions/checkout@v7
        with:
          clean: true
          fetch-depth: 0
          fetch-tags: true
          submodules: recursive

      - name: Extract version
        run: |
          APP_NAME="NXThemesInstaller"
          VER_FILE="SwitchThemesNX/Makefile"
          KEY="APP_VERSION"
          
          VERSION="$(grep -F "$KEY" "$VER_FILE" | grep -oE '[0-9]+' | head -3 | paste -s -d '.')"
          SHORT_HASH="$(git rev-parse --short=7 HEAD)"
          echo "TAG_NAME=v${VERSION}-${SHORT_HASH}" >> "$GITHUB_ENV"
          echo "RELEASE_NAME=${APP_NAME} v${VERSION} (${SHORT_HASH})" >> "$GITHUB_ENV"

      - name: Setup dotnet 8
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '8.0.x'

      - name: Build ThemeSysmodule
        run: |
          cd ThemeSysmodule
          make
          strings ThemeSysmodule.nsp | grep -oE "THEME_SYMODULE:[0-9]{1,2}=" || exit 1
          mkdir -p ../SwitchThemesNX/romfs/sysmodule/
          cp ThemeSysmodule.nsp toolbox.json ../SwitchThemesNX/romfs/sysmodule/

      - name: Generate C++ sources (NxThemeTool cppgen)
        run: |
          cd NxThemeTool
          dotnet run -- cppgen ../SwitchThemesNX/source/SwitchThemesCommon/Generated

      - name: Build SwitchThemesNX
        run: |
          cd SwitchThemesNX
          make libs
          make all "GITVER=CI-$(git rev-parse HEAD)" -j$(nproc)
          mkdir -p ../build_out
          cp SwitchThemesNX.nro ../build_out/NXThemesInstaller.nro

      - name: Upload release asset
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ env.TAG_NAME }}
          name: ${{ env.RELEASE_NAME }}
          draft: false
          prerelease: false
          generate_release_notes: true
          make_latest: true
          files: |
            build_out/NXThemesInstaller.nro
